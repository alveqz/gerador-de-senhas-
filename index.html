<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="conteudo">

        <div class="conteudo-titulo">
            <img src="unlock.svg" alt="Ícone de cadeado">
            <h1 class="titulo-principal">Gerador de Senhas</h1>
            <p class="titulo-secundario">
                Gere instantaneamente uma senha aleatória e segura.
            </p>
        </div>

        <!-- Campo da senha -->
        <div class="conteudo-senha">

            <label for="campo-senha">Senha</label>

            <div class="senha-container">
                <input
                    type="text"
                    id="campo-senha"
                    readonly
                    placeholder="Sua senha aparecerá aqui">

                <button id="copiar">
                    📋 Copiar
                </button>
            </div>

        </div>

        <!-- Configurações -->
        <div class="parametro">

            <h2 class="parametro-titulo">
                Personalize sua senha
            </h2>

            <!-- Quantidade -->
            <div class="parametro-senha">

                <h3 class="parametro-senha__titulo">
                    Número de caracteres
                </h3>

                <div class="parametro-senha-botoes">

                    <button id="diminuir" class="parametro-senha__botao">
                        −
                    </button>

                    <span id="valor-caracteres" class="parametro-senha__texto">
                        12
                    </span>

                    <button id="aumentar" class="parametro-senha__botao">
                        +
                    </button>

                </div>

            </div>

            <!-- Características -->
            <div class="parametro-senha">

                <h3 class="parametro-senha__titulo">
                    Características da senha
                </h3>

                <label>
                    <input type="checkbox" id="minusculas" checked>
                    Letras minúsculas (abc)
                </label>

                <label>
                    <input type="checkbox" id="maiusculas" checked>
                    Letras maiúsculas (ABC)
                </label>

                <label>
                    <input type="checkbox" id="numeros" checked>
                    Números (123)
                </label>

                <label>
                    <input type="checkbox" id="simbolos" checked>
                    Símbolos (!@#$%&)
                </label>

            </div>

            <!-- Força -->
            <div class="parametro-senha">

                <h3 class="parametro-senha__titulo">
                    Força da senha
                </h3>

                <div class="barra-forca">
                    <div id="nivel-forca"></div>
                </div>

                <p id="texto-forca">
                    Média
                </p>

            </div>

            <!-- Botão principal -->
            <button id="gerar-senha" class="botao-gerar">
                🔒 Gerar Nova Senha
            </button>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
